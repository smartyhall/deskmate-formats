name: Portable tests and packaging
on: [push, pull_request]
permissions:
  contents: read
jobs:
  portable:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.13', '3.14']
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install build and static analysis tools
        run: python -m pip install build ruff "reuse[charset-normalizer]"
      - name: License declarations (REUSE)
        run: python -m reuse lint
      - name: Build wheel and source archive
        run: python -m build
      - name: Install built wheel
        run: python tools/install_wheel.py
      - name: Check imports and CLI entry points
        run: python tools/check_install.py
      - name: Observer tests without image dependency
        run: python -m unittest discover -s tests/portable -p "test_observer*.py" -v
      - name: Install built wheel with observer image extra
        run: python tools/install_wheel.py --observer
      - name: Install app-server schema validator
        run: python -m pip install "jsonschema>=4.23,<5"
      - name: Portable tests only (no lab fixtures)
        run: python -m unittest discover -s tests/portable -v
      - name: Deployment script portability tests (synthetic; no VM media)
        run: python -m unittest discover -s deployment/windows10/tests -v
      - name: Static analysis
        run: python -m ruff check src tests/portable tools
      - name: Audit repository content
        run: python tools/audit_repository.py
      - name: Install the built wheel with its MCP extra
        run: python -c "from pathlib import Path; import subprocess, sys; wheel, = Path('dist').glob('*.whl'); subprocess.run([sys.executable, '-m', 'pip', 'install', str(wheel) + '[mcp]'], check=True)"
      - name: Official MCP SDK stdio integration (synthetic native peer)
        run: python -m unittest discover -s tests/portable -p test_mcp_stdio.py -v
