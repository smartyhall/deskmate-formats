name: Portable tests and packaging
on: [push, pull_request]
permissions:
  contents: read
jobs:
  portable:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.13', '3.14']
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install build and static analysis tools
        run: python -m pip install build ruff "reuse[charset-normalizer]"
      - name: License declarations (REUSE)
        run: python -m reuse lint
      - name: Build wheel and source archive
        run: python -m build
      - name: Install built wheel
        run: python tools/install_wheel.py
      - name: Check imports and CLI entry points
        run: python tools/check_install.py
      - name: Portable tests only (no lab fixtures)
        run: python -m unittest discover -s tests/portable -v
      - name: Static analysis
        run: python -m ruff check src tests/portable tools
      - name: Audit repository content
        run: python tools/audit_repository.py
