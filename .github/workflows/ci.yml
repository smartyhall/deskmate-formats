name: Portable tests and packaging
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      portable: ${{ steps.scope.outputs.portable }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify changes conservatively
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: python tools/ci_scope.py
  portable:
    needs: changes
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.13', '3.14']
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
    steps:
      - name: Record intentional site-only portable skip
        if: ${{ needs.changes.outputs.portable == 'false' }}
        run: echo "Site-only changes; required portable matrix status completed; full tests covered by reference preview."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ needs.changes.outputs.portable == 'true' }}
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: ${{ needs.changes.outputs.portable == 'true' }}
        with:
          python-version: ${{ matrix.python }}
      - name: Install build and static analysis tools
        if: ${{ needs.changes.outputs.portable == 'true' }}
        run: python -m pip install build ruff "reuse[charset-normalizer]"
      - name: License declarations (REUSE)
        if: ${{ needs.changes.outputs.portable == 'true' }}
        run: python -m reuse lint
      - name: Build wheel and source archive
        if: ${{ needs.changes.outputs.portable == 'true' }}
        run: python -m build
      - name: Install built wheel
        if: ${{ needs.changes.outputs.portable == 'true' }}
        run: python tools/install_wheel.py
      - name: Check imports and CLI entry points
        if: ${{ needs.changes.outputs.portable == 'true' }}
        run: python tools/check_install.py
      - name: Observer tests without image dependency
        if: ${{ needs.changes.outputs.portable == 'true' }}
        run: python -m unittest discover -s tests/portable -p "test_observer*.py" -v
      - name: Install built wheel with observer image extra
        if: ${{ needs.changes.outputs.portable == 'true' }}
        run: python tools/install_wheel.py --observer
      - name: Install optional schema and outline tools
        if: ${{ needs.changes.outputs.portable == 'true' }}
        run: python -m pip install "jsonschema>=4.23,<5" "fonttools>=4.55,<5"
      - name: Portable tests only (no lab fixtures)
        if: ${{ needs.changes.outputs.portable == 'true' }}
        run: python -m unittest discover -s tests/portable -v
      - name: Deployment script portability tests (synthetic; no VM media)
        if: ${{ needs.changes.outputs.portable == 'true' }}
        run: python -m unittest discover -s deployment/windows10/tests -v
      - name: Static analysis
        if: ${{ needs.changes.outputs.portable == 'true' }}
        run: python -m ruff check src tests/portable tools
      - name: Audit repository content
        if: ${{ needs.changes.outputs.portable == 'true' }}
        run: python tools/audit_repository.py
      - name: Install the built wheel with its MCP extra
        if: ${{ needs.changes.outputs.portable == 'true' }}
        run: python -c "from pathlib import Path; import subprocess, sys; wheel, = Path('dist').glob('*.whl'); subprocess.run([sys.executable, '-m', 'pip', 'install', str(wheel) + '[mcp]'], check=True)"
      - name: Official MCP SDK stdio integration (synthetic native peer)
        if: ${{ needs.changes.outputs.portable == 'true' }}
        run: python -m unittest discover -s tests/portable -p test_mcp_stdio.py -v
