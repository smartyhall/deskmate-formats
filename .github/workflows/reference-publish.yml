# Publish reviewed content automatically after merge to main. Manual recovery remains available.
# The build/audit/deploy steps run together; site assets never bypass validation.
name: Publish DeskMate reference

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "docs/**"
      - "tools/check_reference_pages.py"
      - ".github/workflows/reference-publish.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "deskmate-reference-pages"
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate reviewed reference map
        run: python tools/check_reference_pages.py
      - name: Install dependencies
        working-directory: website
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Test site
        working-directory: website
        run: npm test
      - name: Build for GitHub Pages
        working-directory: website
        env:
          SITE_BASE_PATH: /
        run: npm run build
      - name: Audit generated internal links
        run: python website/scripts/check_generated_site.py website/_site /
      - name: Verify original theme and attribution
        run: |
          test -s website/_site/assets/vendor/bootstra386/css/bootstrap.min.css
          test -s website/_site/assets/vendor/bootstra386/js/bootstrap.bundle.min.js
          test -s website/_site/assets/vendor/bootstra386/js/bootstrap-386.js
          test -s website/_site/assets/vendor/bootstra386/fonts/Px437_IBM_EGA8.otf
          test -s website/_site/assets/vendor/bootstra386/ATTRIBUTION.txt
          test -s website/_site/index.html
          test -s website/_site/search/index.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: website/_site
      # Pages sometimes queries the Actions artifact index before a just-uploaded
      # artifact is visible. Poll this run's artifacts rather than rerun the
      # failed deploy job, which would upload a duplicate github-pages artifact.
      - name: Wait for Pages artifact indexing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..30}; do
            if count="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" --jq '[.artifacts[] | select(.name == "github-pages" and .expired == false)] | length')"; then
              if [[ "$count" == "1" ]]; then
                echo "Pages artifact indexed for this run (attempt $attempt)."
                exit 0
              fi
              if [[ "$count" != "0" ]]; then
                echo "::error::Expected one github-pages artifact; found $count."
                exit 1
              fi
            fi
            sleep 3
          done
          echo "::error::Timed out waiting for the Pages artifact to be indexed."
          exit 1
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
