[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deskmate-formats"
version = "0.1.0.dev0"
description = "Independent documentation and tools for preserving Tandy DeskMate native file formats"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "LICENSES/*.txt", "LICENSING.md", "LICENSING.md.license", "README.md.license"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

[project.optional-dependencies]
dev = ["build>=1.2", "ruff>=0.11", "reuse[charset-normalizer]>=6.0"]
mcp = ["mcp>=2.3,<3", "anyio>=4.9,<5"]
observer = ["Pillow>=13.0.0,<14"]
supervisor = ["jsonschema>=4.23,<5"]

[project.scripts]
deskmate-calendar = "deskmate_formats.calendar.cli:main"
deskmate-calendar-append = "deskmate_formats.calendar.writer:main"
deskmate-addressbook = "deskmate_formats.addressbook.cli:main"
deskmate-addressbook-create = "deskmate_formats.addressbook.cli:create_main"
deskmate-86box-mcp = "deskmate_formats.automation.mcp_server:main"
deskmate-86box-observer = "deskmate_formats.observer.demo:main"
deskmate-observer-event = "deskmate_formats.observer.event_cli:main"
deskmate-observer-codex = "deskmate_formats.observer.codex_cli:main"
deskmate-supervisor-task = "deskmate_formats.supervisor.task_cli:main"
deskmate-supervisor-s0 = "deskmate_formats.supervisor.driver_cli:main"
deskmate-supervisor-s2 = "deskmate_formats.supervisor.bridge_cli:main"

[tool.setuptools.package-data]
"*" = ["*.license"]
"deskmate_formats.observer" = ["dashboard.css", "dashboard.js"]
"deskmate_formats.supervisor" = ["codex-0.166.0.json", "CODEX-NOTICE.txt"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["F63", "F7", "F82"]
